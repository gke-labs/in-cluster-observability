# Docs site: Astro Starlight under docs/site/ (go-steer convention,
# mirrors go-steer/core-agent — see #182). npm-only toolchain, fully
# pinned by package-lock.json; no build-time dependency resolution of
# any kind (the Hugo-era `hugo mod get -u` upgraded the theme past the
# repo's pin and broke the merge gate the day Docsy v0.16 shipped).
#
# PRs run build + link/redirect verification only; push-to-main (and
# manual dispatch) additionally deploy to GitHub Pages.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'scripts/verify-internal-links.py'
      - 'scripts/verify-redirects.py'
      - 'scripts/generate-redirects.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'scripts/verify-internal-links.py'
      - 'scripts/verify-redirects.py'
      - 'scripts/generate-redirects.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Cancel superseded runs so we don't deploy a stale build over a fresh one.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the workflow level; the Pages grants
# (`pages: write` + `id-token: write`) are scoped to the deploy job.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ratchet:actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install (locked)
        working-directory: docs/site
        run: npm ci

      - name: Build
        working-directory: docs/site
        run: npm run build

      # The redirect stubs for legacy Hugo URLs are committed under
      # docs/site/public/ (regenerate with scripts/generate-redirects.py);
      # verify they point at live pages, then verify every internal
      # link in the built site resolves.
      - name: Verify redirect stubs
        run: python3 scripts/verify-redirects.py

      - name: Verify internal links
        run: python3 scripts/verify-internal-links.py

      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # ratchet:actions/configure-pages@v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # ratchet:actions/upload-pages-artifact@v3
        with:
          path: docs/site/dist

  deploy:
    name: deploy
    needs: build
    # PR runs validate the build but must NOT publish to Pages —
    # only push-to-main (and manual workflow_dispatch from main)
    # promote to the live site.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The only job that touches Pages: OIDC token + deployment write.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # ratchet:actions/deploy-pages@v4
