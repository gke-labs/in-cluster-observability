# Demo workload for the HPA example (see README.md): an HTTP echo
# server plus a client that drives ~5 requests/second at it. The
# workloads are deliberately NOT instrumented — the point of the demo
# is that OBI captures their traffic from the outside and the HPA
# scales on it. This is the same workload the e2e suite's
# TestHPACustomMetrics scales (tests/e2e/harness.go).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: echo}
  template:
    metadata:
      labels: {app: echo}
    spec:
      containers:
        - name: echo
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: default
spec:
  selector: {app: echo}
  ports:
    - port: 8080
      targetPort: 8080
---
# Steady traffic so the qps metric has data. Scale this Deployment up
# (or its request rate via the sleep) to push the HPA harder; delete
# it to watch the HPA scale echo back down.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-client
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: traffic-client}
  template:
    metadata:
      labels: {app: traffic-client}
    spec:
      containers:
        - name: client
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          command: ["/bin/sh", "-c"]
          args:
            - while true; do wget -q -O /dev/null http://echo.default.svc:8080/hostname || true; sleep 0.2; done
