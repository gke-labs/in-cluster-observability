# RBAC for the v0.4 ollie-controller (per ADR-0022 + control-plane.md §7).
#
# The controller reconciles TrafficMonitor + ClusterTrafficPolicy CRDs
# and Pods into per-pod MonitoringSpecs, then streams them to agents
# via the gRPC AgentSession bidirectional RPC. Permissions match the
# documented v0.4 scope:
#
#   - CRDs we own       — read + status patch.
#   - Pods + Nodes      — read for selector resolution.
#   - Leases            — full mutate for leader election.
#   - Events            — create/patch for operator-facing emission.
#
# v0.4 scope cuts (per ADR-0022.5): no services or endpointslices —
# those were for the deferred identity informer; no Roles/RoleBindings
# — the controller is namespaced to ollie-system but its watch scope
# is cluster-wide.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ollie-controller
  namespace: ollie-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ollie-controller
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: controller
rules:
  # Our CRDs.
  - apiGroups: ["ollie.gke-labs.dev"]
    resources: ["trafficmonitors", "clustertrafficpolicies"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["ollie.gke-labs.dev"]
    resources: ["trafficmonitors/status", "clustertrafficpolicies/status"]
    verbs: ["update", "patch"]
  # Pod + Node read — selector resolution.
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
  # Leader election (Lease).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Event emission for operator visibility.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Self-managed CA (ADR-0028, #196): the leader injects the CA into the
  # custom-metrics APIService caBundle and drops insecureSkipTLSVerify.
  # The controller only Gets and MergePatches this one object by name, so
  # the grant is resourceNames-scoped to it (get/patch only) — mirroring
  # the validatingwebhookconfigurations rule below.
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    resourceNames: ["v1beta1.custom.metrics.k8s.io"]
    verbs: ["get", "patch"]
  # Validating webhook (ADR-0030, #90): the leader injects the CA into
  # the ValidatingWebhookConfiguration caBundle and flips failurePolicy
  # Ignore->Fail once every webhook endpoint serves the CA cert.
  # resourceNames-scoped: get/update/patch only on the one object.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    resourceNames: ["ollie-webhook"]
    verbs: ["get", "update", "patch"]
---
# Namespaced grant for the self-managed CA (ADR-0028): the controller
# creates/rotates the CA and query serving-cert Secrets in its own
# namespace, and reads the query Service endpoints to gate the
# insecureSkipTLSVerify flip. Scoped to ollie-system rather than folded
# into the cluster-wide role — the controller's only Secret access is
# these two objects it owns.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ollie-controller-ca
  namespace: ollie-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: controller
rules:
  # CA + serving-cert Secrets (ADR-0028; the agent serving Secret
  # rides the same rule for intra-ollie TLS, ADR-0029).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ollie-controller-ca
  namespace: ollie-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ollie-controller-ca
subjects:
  - kind: ServiceAccount
    name: ollie-controller
    namespace: ollie-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ollie-controller
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ollie-controller
subjects:
  - kind: ServiceAccount
    name: ollie-controller
    namespace: ollie-system
