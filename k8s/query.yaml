# v0.5 ollie-query (#94): stateless 2-replica query server. Discovers
# agents via the ollie-agent headless Service, fans PromQL reads out
# to each agent's remote-read endpoint, serves the Prometheus-
# compatible HTTP API. TLS posture per ADR-0025 §7: plain HTTP inside
# the default-deny namespace for v0.5; transport hardening is v0.6.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ollie-query
  namespace: ollie-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: query
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollie-query
  namespace: ollie-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: query
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ollie
      app.kubernetes.io/component: query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollie
        app.kubernetes.io/component: query
    spec:
      serviceAccountName: ollie-query
      containers:
        - name: query
          image: ollie-query
          args:
            - --http-addr=0.0.0.0:9095
            - --agent-service=ollie-agent.ollie-system.svc.cluster.local
            - --agent-port=9091
            # custom.metrics.k8s.io backend for the aggregation
            # layer (#96); self-signed TLS per ADR-0025 §7.
            - --tls-addr=0.0.0.0:6443
            - --custom-metrics-config=/etc/ollie/custom-metrics/config.yaml
            # Cluster-wide stream service (#99).
            - --stream-addr=0.0.0.0:9096
            - --agent-stream-port=9092
          ports:
            - name: http
              containerPort: 9095
            - name: https
              containerPort: 6443
            - name: grpc-stream
              containerPort: 9096
          livenessProbe:
            httpGet: { path: /healthz/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: custom-metrics-config
              mountPath: /etc/ollie/custom-metrics
              readOnly: true
      volumes:
        - name: custom-metrics-config
          configMap:
            name: ollie-custom-metrics
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: ollie-query
  namespace: ollie-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: query
spec:
  selector:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: query
  ports:
    - name: http
      port: 9095
      targetPort: http
      protocol: TCP
    - name: https
      port: 6443
      targetPort: https
      protocol: TCP
    - name: grpc-stream
      port: 9096
      targetPort: grpc-stream
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ollie-query
  namespace: ollie-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: query
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollie
      app.kubernetes.io/component: query
