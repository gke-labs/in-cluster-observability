# RBAC for the v0.3 agent DaemonSet (per ADR-0021).
#
# OBI runs as a sibling container in the agent Pod and uses a K8s
# informer to attach K8s metadata (k8s.namespace.name / k8s.pod.name /
# k8s.deployment.name / k8s.node.name / k8s.container.name / etc.)
# to every captured event. The informer needs cluster-scoped list/
# watch on pods, services, nodes, and replicasets — verbs match
# upstream OBI's documented unprivileged DaemonSet example.
#
# Scope is intentionally minimal: list + watch only; no get/create/
# update/delete/patch. The agent never mutates cluster state.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ollie-agent
  namespace: ollie-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ollie-agent
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: agent
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "nodes"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ollie-agent
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ollie-agent
subjects:
  - kind: ServiceAccount
    name: ollie-agent
    namespace: ollie-system
---
# Scrape-endpoint authorization (#145). The agent validates scraper
# bearer tokens in-process (TokenReview) and authorizes them via
# SubjectAccessReview for `get` on nonResourceURL /metrics. Granting
# scrape access = binding a ServiceAccount to this ClusterRole —
# something only an RBAC-granter can do, unlike namespace/pod labels.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ollie-metrics-reader
  labels:
    app.kubernetes.io/name: ollie
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
# The agent needs to *perform* TokenReview + SubjectAccessReview.
# system:auth-delegator is the built-in ClusterRole for exactly this
# delegated-authn pattern.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ollie-agent-auth-delegator
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: ollie-agent
    namespace: ollie-system
---
# Default grant: GKE Managed Prometheus collectors (gmp-system).
# Inert on clusters without that ServiceAccount — RBAC subjects need
# not exist. For other scrapers, add your scraper's ServiceAccount as
# a subject here (or in a separate binding), and adjust the
# NetworkPolicy scraper namespace to match (k8s/networkpolicy.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ollie-metrics-reader
  labels:
    app.kubernetes.io/name: ollie
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ollie-metrics-reader
subjects:
  - kind: ServiceAccount
    name: collector
    namespace: gmp-system
---
# Query-server fan-out authorization (v0.5, #95). The agent guards
# its remote-read endpoint (/api/v1/read on :9091) with the same
# in-process TokenReview + SubjectAccessReview as /metrics; remote
# read is a POST, so the SAR verb is `post`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ollie-query-reader
  labels:
    app.kubernetes.io/name: ollie
rules:
  - nonResourceURLs: ["/api/v1/read"]
    verbs: ["post"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ollie-query-reader
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: query
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ollie-query-reader
subjects:
  - kind: ServiceAccount
    name: ollie-query
    namespace: ollie-system
---
# The query server performs TokenReview + SubjectAccessReview for its
# own /api/v1/* surface (bearer-token auth, mirroring the agent).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ollie-query-auth-delegator
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: query
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: ollie-query
    namespace: ollie-system
---
# PromQL API consumers (v0.5, #94). Bind a ServiceAccount to this
# ClusterRole to let it query /api/v1/query and /api/v1/query_range
# on the query server. No default subjects: cluster operators grant
# explicitly. (Loopback — e.g. port-forward — is exempt for
# debugging.)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ollie-promql-reader
  labels:
    app.kubernetes.io/name: ollie
rules:
  - nonResourceURLs: ["/api/v1/query", "/api/v1/query_range"]
    verbs: ["get", "post"]
---
# Stream-service authorization (v0.5, #99). gRPC methods authorize
# as nonResourceURLs (the full method path) with verb `post` — what
# gRPC is on the wire. One grant covers both the agents' node-local
# service and the query server's cluster mux.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ollie-stream-reader
  labels:
    app.kubernetes.io/name: ollie
rules:
  - nonResourceURLs: ["/ollie.stream.v1.StreamService/*"]
    verbs: ["post"]
---
# The query server subscribes to every agent's node-local stream.
# External consumers (AI agents, iobsctl in-cluster) get their own
# binding to ollie-stream-reader; loopback (port-forward) is exempt.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ollie-query-stream-reader
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: query
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ollie-stream-reader
subjects:
  - kind: ServiceAccount
    name: ollie-query
    namespace: ollie-system
