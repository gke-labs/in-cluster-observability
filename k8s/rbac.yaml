# RBAC for the v0.3 agent DaemonSet (per ADR-0021).
#
# OBI runs as a sibling container in the agent Pod and uses a K8s
# informer to attach K8s metadata (k8s.namespace.name / k8s.pod.name /
# k8s.deployment.name / k8s.node.name / k8s.container.name / etc.)
# to every captured event. The informer needs cluster-scoped list/
# watch on pods, services, nodes, and replicasets — verbs match
# upstream OBI's documented unprivileged DaemonSet example.
#
# Scope is intentionally minimal: list + watch only; no get/create/
# update/delete/patch. The agent never mutates cluster state.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ollie-agent
  namespace: ollie-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ollie-agent
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: agent
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "nodes"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ollie-agent
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ollie-agent
subjects:
  - kind: ServiceAccount
    name: ollie-agent
    namespace: ollie-system
---
# Scrape-endpoint authorization (#145). The agent validates scraper
# bearer tokens in-process (TokenReview) and authorizes them via
# SubjectAccessReview for `get` on nonResourceURL /metrics. Granting
# scrape access = binding a ServiceAccount to this ClusterRole —
# something only an RBAC-granter can do, unlike namespace/pod labels.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ollie-metrics-reader
  labels:
    app.kubernetes.io/name: ollie
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
# The agent needs to *perform* TokenReview + SubjectAccessReview.
# system:auth-delegator is the built-in ClusterRole for exactly this
# delegated-authn pattern.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ollie-agent-auth-delegator
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: ollie-agent
    namespace: ollie-system
---
# Default grant: GKE Managed Prometheus collectors (gmp-system).
# Inert on clusters without that ServiceAccount — RBAC subjects need
# not exist. For other scrapers, add your scraper's ServiceAccount as
# a subject here (or in a separate binding), and adjust the
# NetworkPolicy scraper namespace to match (k8s/networkpolicy.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ollie-metrics-reader
  labels:
    app.kubernetes.io/name: ollie
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ollie-metrics-reader
subjects:
  - kind: ServiceAccount
    name: collector
    namespace: gmp-system
