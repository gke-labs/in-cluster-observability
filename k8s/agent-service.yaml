# Headless Service over the agent DaemonSet (ADR-0025 §5): one DNS A
# record per agent pod. The query server resolves this name on an
# interval to discover fan-out targets — no control-plane coupling,
# no registry.
#
# publishNotReadyAddresses is deliberately false: an agent that fails
# its readiness probe drops out of the fan-out set instead of eating
# a per-query deadline miss.
apiVersion: v1
kind: Service
metadata:
  name: ollie-agent
  namespace: ollie-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: agent
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: agent
  ports:
    - name: remote-read
      port: 9091
      targetPort: remote-read
      protocol: TCP
