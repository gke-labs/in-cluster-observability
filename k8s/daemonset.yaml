# v0.3 DaemonSet (sibling-container model per ADR-0018; lean shape
# per ADR-0021):
#   - obi    : upstream OBI image; eBPF capture + K8s metadata
#              informer; emits OTLP to the agent on loopback.
#   - agent  : our image; OTLP receiver + OBI config writer + the
#              single Prometheus scrape endpoint on :9090.
# The two containers share the pod network namespace (loopback OTLP)
# and an emptyDir at /etc/ollie/obi-config/ for the agent-written OBI
# config file. The pod runs as the ollie-agent ServiceAccount (see
# k8s/rbac.yaml) so OBI's informer has list/watch on pods/services/
# nodes/replicasets.
#
# Image references use bare names; ap deploy adds the registry prefix.
# No imagePullPolicy (repo convention).

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ollie-agent
  namespace: ollie-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ollie
      app.kubernetes.io/component: agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # Bounded rollout: at most 10% of nodes lose capture at once
      # during an agent upgrade (#155).
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollie
        app.kubernetes.io/component: agent
    spec:
      # Observability node agents must run everywhere and survive
      # node pressure: schedule onto tainted nodes (control plane,
      # dedicated pools) and claim the standard node-critical
      # priority (#155).
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      # ServiceAccount granted list/watch on pods/services/nodes/
      # replicasets so OBI's K8s metadata informer can attach
      # k8s.* attrs to captured events (per ADR-0021).
      serviceAccountName: ollie-agent
      hostPID: true  # required so OBI can see processes in sibling pods
      containers:
        # Sibling OBI container: privileged, eBPF capture, OTLP -> localhost.
        - name: obi
          # Pinned per ADR-0010 / ADR-0018 (image tag, not Go module).
          # Upstream OBI publishes to Docker Hub at otel/ebpf-instrument,
          # not GHCR.
          image: otel/ebpf-instrument:v0.10.0
          env:
            # OBI v0.9 reads its YAML config from this env var, NOT a
            # CLI flag. Earlier iterations of this manifest passed
            # --config=... as args; OBI silently ignored it.
            - name: OTEL_EBPF_CONFIG_PATH
              value: "/etc/ollie/obi-config/config.yaml"
            # OBI v0.9+ refuses to start without explicit feature flags.
            # `network`     = L4 TCP metrics (ModuleL4TCP).
            # `application` = L7 HTTP/gRPC spans and metrics
            #                 (ModuleHTTP1/2/GRPC).
            # `stats` (OBI's own self-obs) is intentionally omitted —
            # the agent has its own ollie_capture_* counters.
            - name: OTEL_EBPF_METRICS_FEATURES
              value: "network,application"
            # Per ADR-0021: OBI is the source of K8s identity. The
            # informer needs the RBAC granted in k8s/rbac.yaml.
            - name: OTEL_EBPF_KUBE_METADATA_ENABLE
              value: "autodetect"
            # Fail loudly if a required capability is missing rather
            # than silently no-opping the affected probes. Worth the
            # CrashLoopBackoff at deploy time — silent cap-gap bugs
            # are painful to debug otherwise.
            - name: OTEL_EBPF_ENFORCE_SYS_CAPS
              value: "true"
            # OBI's HTTP exporter requires a real URL (host:port alone
            # parses as scheme:path and is rejected). Point at the
            # agent's loopback OTLP HTTP listener.
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://127.0.0.1:4318"
          resources:
            requests:
              cpu: 100m
              memory: 150Mi
            limits:
              cpu: 500m
              # BPF map allocations are charged to this cgroup (kernel
              # ≥5.11). Loading OBI's full L7 uprobe tracer set on the
              # first instrumented process needs headroom well past the
              # steady-state footprint — at 300Mi the tracer load died
              # with ENOMEM on map create (caught by tests/e2e, #150).
              memory: 512Mi
          securityContext:
            # Capability set matches upstream OBI's documented
            # unprivileged DaemonSet example. The L7 caps (SYS_PTRACE,
            # CHECKPOINT_RESTORE, DAC_READ_SEARCH) are what let OBI
            # cross PID namespaces and read target-process ELF files;
            # without them Application mode silently no-ops while L4
            # (socket filter) keeps working — exactly the failure mode
            # the lean v0.3 smoke test exposed. SYS_ADMIN is only
            # required for Go context propagation and very old
            # kernels — kept until those code paths are intentionally
            # dropped.
            capabilities:
              add:
                - BPF                # load eBPF programs and create maps
                - PERFMON            # perf events, ringbuffers
                - NET_ADMIN          # several BPF program types
                                     # (e.g. socket-filter registration
                                     # via SO_ATTACH_BPF)
                - NET_RAW            # OBI's network-mode socket filter
                - SYS_PTRACE         # cross container namespaces and
                                     # inspect target executables
                                     # (required for L7 discovery)
                - CHECKPOINT_RESTORE # open target ELF files (uprobe attach)
                - DAC_READ_SEARCH    # bypass DAC on /proc/<pid>/exe
                                     # and mounted container roots
                - SYS_ADMIN          # empirically REQUIRED by OBI's
                                     # L7 uprobe path: drop attempts
                                     # left L4 flowing but killed HTTP
                                     # capture (go.Tracer: "Kernel in
                                     # lockdown mode or missing
                                     # CAP_SYS_ADMIN"). Verified by
                                     # tests/e2e on v0.9.0 (#155) and
                                     # again on v0.10.0 (#152).
                                     # Re-attempt on each OBI bump.
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 0  # eBPF load needs uid 0 in the user namespace
          volumeMounts:
            - name: bpf
              mountPath: /sys/fs/bpf
            - name: proc
              mountPath: /proc
              readOnly: true
            - name: btf
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: obi-config
              mountPath: /etc/ollie/obi-config
            # OBI's working directory (per upstream's documented example).
            - name: var-run-obi
              mountPath: /var/run/obi
            # Cgroup access for cross-container process discovery
            # (per upstream's documented example).
            - name: cgroup
              mountPath: /sys/fs/cgroup

        # Agent container: unprivileged; OTLP receiver + OBI config
        # writer + the single Prometheus scrape endpoint on :9090.
        - name: agent
          image: ollie
          args:
            - --otlp-grpc-addr=127.0.0.1:4317
            - --otlp-http-addr=127.0.0.1:4318
            - --obi-config=/etc/ollie/obi-config/config.yaml
            # v0.4: controller gRPC AgentSession stream. When the
            # controller Deployment (k8s/controller.yaml) is
            # installed, agents dial it for declarative per-pod
            # MonitoringSpecs sourced from TrafficMonitor CRs. The
            # --obi-instrument-ports seed below remains as a
            # standalone-mode fallback for clusters without the
            # controller.
            - --controller-addr=ollie-controller.ollie-system.svc:9102
            - --obi-instrument-ports=80,443,8080,8443
            - --scrape-addr=0.0.0.0:9090
            # Bearer-token auth on /metrics (#145): scrapers must
            # present a ServiceAccount token bound to the
            # ollie-metrics-reader ClusterRole (k8s/rbac.yaml).
            # Loopback (pod-internal) requests are exempt. Explicit
            # here even though in-cluster 'auto' resolves the same,
            # so the production posture is visible in the manifest.
            - --scrape-auth=token
            # v0.5 store + fan-out read path (#78, #95). Explicit so
            # the production posture is visible: tsdb on the
            # ollie-data emptyDir, remote read on :9091 guarded by
            # the same token auth as :9090 (ollie-query-reader).
            - --store-dir=/var/lib/ollie/tsdb
            - --query-addr=0.0.0.0:9091
          env:
            # Downward API: node name flows into the agent's
            # AgentHello so the controller can route per-pod deltas
            # to the right agent session.
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: scrape
              containerPort: 9090
              protocol: TCP
            # Remote-read endpoint for the query server's PromQL
            # fan-out (v0.5, #95). Same bearer-token posture as
            # :9090; NetworkPolicy additionally pins ingress to
            # query-server pods.
            - name: remote-read
              containerPort: 9091
              protocol: TCP
          # tcpSocket rather than httpGet (#155): /metrics requires a
          # bearer token in-cluster (--scrape-auth, #145) and kubelet
          # probes don't carry one. A TCP connect verifies the scrape
          # listener is up without weakening auth; a wedged listener
          # was previously invisible.
          readinessProbe:
            tcpSocket:
              port: scrape
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: scrape
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 300m
              memory: 200Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            # The agent is an ordinary unprivileged process; the
            # runtime's default seccomp filter costs nothing here
            # (#155). The obi container stays unconfined — its BPF
            # syscall surface is exactly what default profiles gate.
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: obi-config
              mountPath: /etc/ollie/obi-config
            # Node-local metric store (v0.5, #78): tsdb blocks + WAL.
            # emptyDir by design (ADR-0025) — with 10-minute retention
            # there is nothing worth persisting across pod deletion,
            # and the WAL still recovers container restarts within the
            # pod's lifetime.
            - name: ollie-data
              mountPath: /var/lib/ollie

      volumes:
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: btf
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: obi-config
          emptyDir: {}
        - name: var-run-obi
          emptyDir: {}
        - name: ollie-data
          emptyDir:
            sizeLimit: 1Gi
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
