# Default-deny ingress for ollie-system workloads (#143).
#
# The agent re-emits OBI-captured metrics — carrying k8s.* identity
# and traffic volumes for monitored workloads across namespaces — on
# :9090. Without a policy, any pod in the cluster can scrape it.
# These policies flip both workloads to default-deny ingress with the
# minimum allow rules:
#
#   agent      :9090 (scrape)  <- metrics-collection namespace only
#   controller :9102 (stream)  <- agent pods in ollie-system only
#   controller :9100 (metrics) <- metrics-collection namespace only
#
# The controller's :9101 healthz needs no rule: kubelet probes
# originate from the node and bypass NetworkPolicy.
#
# The scraper is identified by NAMESPACE NAME via the API-server-
# managed `kubernetes.io/metadata.name` label (immutable, set
# automatically on every namespace). A custom opt-in label is
# deliberately NOT used: label-based grants are only as strong as
# label-write RBAC, whereas a namespace name can't be spoofed. The
# default is `gmp-system` (GKE Managed Prometheus collectors). For a
# different scraper, patch the namespace name in your kustomize
# overlay, e.g. for prometheus-operator in `monitoring`:
#
#   patches:
#     - target: { kind: NetworkPolicy, namespace: ollie-system }
#       patch: |-
#         - op: replace
#           path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
#           value: monitoring
#
# Caveats:
#   - Enforcement requires a policy-capable CNI (GKE Dataplane V2:
#     yes; Kind's kindnetd: yes on the late-2024+ node images, which
#     embed a kube-network-policies nftables controller — older
#     kindnetd silently ignored these policies). Network position is
#     defense in depth, not identity; bearer-token auth on the
#     endpoint is #145.
#   - Loopback traffic (OBI -> agent OTLP on 127.0.0.1) is intra-pod
#     and never subject to NetworkPolicy.
#
# The v1.0 Helm chart templates the scraper namespace as a value
# (#121); a controller-reconciled knob may supersede this static
# manifest later.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollie-agent-ingress
  namespace: ollie-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ollie
      app.kubernetes.io/component: agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
      ports:
        - port: 9090
          protocol: TCP
    # Query server -> agent remote-read fan-out (v0.5, #95). Pinned
    # to query-server pods in this namespace; bearer-token auth on
    # the endpoint is the identity layer (ollie-query-reader).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ollie
              app.kubernetes.io/component: query
      ports:
        - port: 9091
          protocol: TCP
        # Node-local stream service (v0.5, #99), same trust shape
        # as remote read: only query-server pods.
        - port: 9092
          protocol: TCP
---
# Query server (v0.5, #94): default-deny ingress with :9095 open to
# any source. Access control is the bearer-token layer
# (ollie-promql-reader); consumers are legitimately anywhere
# (operators, AI agents, Grafana). Health probes bypass
# NetworkPolicy (kubelet originates from the node).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollie-query-ingress
  namespace: ollie-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: query
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ollie
      app.kubernetes.io/component: query
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9095
          protocol: TCP
    # kube-apiserver -> custom-metrics backend (#96). The aggregator
    # originates from the control-plane host network, so no pod/
    # namespace selector can pin it; the port stays open at the
    # network layer. Identity is the front-proxy client certificate:
    # ollie-query requires an mTLS cert signed by the cluster's
    # requestheader CA (--custom-metrics-client-auth=requestheader),
    # which only the aggregator holds, so an open port is not an open
    # door.
    - ports:
        - port: 6443
          protocol: TCP
    # Streaming subscribers (v0.5, #99): like :9095, open at the
    # network layer, gated by bearer-token auth
    # (ollie-stream-reader).
    - ports:
        - port: 9096
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollie-controller-ingress
  namespace: ollie-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: controller
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ollie
      app.kubernetes.io/component: controller
  policyTypes:
    - Ingress
  ingress:
    # Scraper -> controller self-obs metrics. Same namespace-name
    # pinning as the agent rule above; patch both together.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
      ports:
        - port: 9100
          protocol: TCP
    # Agent DaemonSet -> gRPC AgentSession stream. Same-namespace
    # podSelector: only ollie agent pods reach :9102.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ollie
              app.kubernetes.io/component: agent
      ports:
        - port: 9102
          protocol: TCP
    # kube-apiserver -> validating admission webhook (#90, ADR-0030).
    # Like the :6443 custom-metrics rule above, the apiserver originates
    # from the control-plane host network, so no pod/namespace selector
    # can pin it; the port stays open at the network layer. Identity is
    # the serving cert the apiserver verifies against the CA-committed
    # caBundle (only ollie-controller holds a CA-signed :9443 cert), so
    # an open port is not an open door. Without this rule a policy-
    # enforcing CNI drops the admission call and the CA manager's own
    # gate-probe, so the webhook never leaves its failurePolicy=Ignore
    # bootstrap posture.
    - ports:
        - port: 9443
          protocol: TCP
