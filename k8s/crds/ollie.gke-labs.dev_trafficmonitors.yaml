---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: trafficmonitors.ollie.gke-labs.dev
spec:
  group: ollie.gke-labs.dev
  names:
    categories:
    - ollie
    kind: TrafficMonitor
    listKind: TrafficMonitorList
    plural: trafficmonitors
    shortNames:
    - tm
    singular: trafficmonitor
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.matchedPodCount
      name: Matched
      type: integer
    - jsonPath: .status.activelyMonitoredPodCount
      name: Active
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TrafficMonitor declares per-workload network capture intent in a
          namespace. Workload teams own these CRs; selects the pods (via
          LabelSelector) and configures which protocols to capture. See
          docs/design/control-plane.md §1.1.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TrafficMonitorSpec is the namespaced opt-in spec.
            properties:
              protocols:
                description: |-
                  Protocols toggles per-protocol capture for the matched pods.
                  At least one protocol must be enabled (CEL XValidation below).
                properties:
                  http:
                    description: |-
                      HTTP enables HTTP/1.1 capture via OBI's Application mode
                      (uprobe attach to processes listening on the configured ports).
                      HTTP/2 and gRPC support arrive in v0.6 (#104, #105).
                    properties:
                      enabled:
                        default: true
                        description: Enabled gates the entire HTTP path. Default false.
                        type: boolean
                      ports:
                        description: |-
                          Ports is the list of TCP ports to instrument. If a matched
                          pod's process opens one of these ports, OBI attaches L7
                          uprobes. Empty defaults to common HTTP ports (80, 8080) at
                          the controller. Each port must be in [1, 65535].
                        items:
                          format: int32
                          type: integer
                        maxItems: 64
                        minItems: 0
                        type: array
                    type: object
                  l4:
                    description: |-
                      L4 enables L4 TCP capture (bytes, RTT) via OBI's network mode.
                      L4 capture uses an in-kernel socket filter and ignores Ports —
                      it observes every TCP flow on the node regardless of port.
                    properties:
                      enabled:
                        default: true
                        description: Enabled gates the entire L4 path. Default false.
                        type: boolean
                    type: object
                type: object
              workloadSelector:
                description: |-
                  WorkloadSelector picks pods in this CR's namespace. Uses
                  standard K8s LabelSelector semantics (matchLabels and
                  matchExpressions). An empty selector matches every pod in
                  the namespace.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
            required:
            - protocols
            - workloadSelector
            type: object
          status:
            description: TrafficMonitorStatus is the standard CR status surface.
            properties:
              activelyMonitoredPodCount:
                description: |-
                  ActivelyMonitoredPodCount is the number of matched pods that
                  have an active spec confirmed by their agent. May lag
                  MatchedPodCount briefly during reconciliation or agent rollout.
                format: int32
                type: integer
              conditions:
                description: |-
                  Conditions follow the standard K8s convention. Known types:
                  `Ready`, `Degraded`, `Conflict`.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              conflicts:
                description: |-
                  Conflicts lists other CRs whose selectors overlap with this
                  one with conflicting protocol settings. Each entry is the
                  fully-qualified CR name (`namespace/name` for TrafficMonitor;
                  just `name` for ClusterTrafficPolicy). Populated by the
                  reactive conflict-detection path that takes the deferred
                  validating webhook's place (ADR-0022.4).
                items:
                  type: string
                type: array
              matchedPodCount:
                description: |-
                  MatchedPodCount is the number of pods currently matched by
                  this CR's workloadSelector. For ClusterTrafficPolicy this is
                  the count of pods this default applies to (after considering
                  more-specific TrafficMonitors that override).
                format: int32
                type: integer
              matchedPodSample:
                description: |-
                  MatchedPodSample is up to 5 pod names from the matched set
                  (sorted lexicographically for determinism). Helpful for
                  eyeballing "did my selector pick what I expected."
                items:
                  type: string
                maxItems: 5
                type: array
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation the reconciler
                  has fully applied. Used by clients to detect "spec changed but
                  status not yet updated."
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
