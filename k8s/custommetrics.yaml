# custom.metrics.k8s.io aggregation (v0.5, #96): the HPA reads our
# metrics through standard K8s API aggregation, backed by ollie-query.
#
# TLS posture per ADR-0028 (#196): the ollie-controller runs a self-
# managed CA (no cert-manager dependency). On the elected leader it
# mints a CA, issues ollie-query's serving cert (mounted from the
# ollie-query-serving Secret), and then — once every query endpoint is
# confirmed to serve the CA-signed cert — sets spec.caBundle and clears
# insecureSkipTLSVerify in a single atomic patch. The API server rejects
# a caBundle that coexists with insecureSkipTLSVerify:true, so the two
# must move together; there is no valid half-applied state. This manifest
# ships insecureSkipTLSVerify:true with NO caBundle as the safe bootstrap
# default: a fresh `kubectl apply -k` is never broken before the
# controller runs, and the transition is self-healing. Do not set a
# caBundle or remove insecureSkipTLSVerify here — the controller owns
# the atomic transition.
#
# CLIENT auth is not deferred: ollie-query requires the aggregation
# layer's front-proxy (requestheader) client certificate on :6443
# (--custom-metrics-client-auth=requestheader). Only the kube-apiserver
# holds a cert signed by the cluster's requestheader CA, so no other pod
# can read cluster-wide metrics off the port. The RoleBinding below lets
# ollie-query read that CA from the API server's published ConfigMap.

apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.custom.metrics.k8s.io
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: query
spec:
  group: custom.metrics.k8s.io
  version: v1beta1
  groupPriorityMinimum: 100
  versionPriority: 100
  insecureSkipTLSVerify: true
  service:
    name: ollie-query
    namespace: ollie-system
    port: 6443
---
# The HPA controller's ServiceAccount must be allowed (by kube-
# apiserver RBAC, evaluated before the aggregator proxies) to read
# custom-metrics resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ollie-custom-metrics-server-resources
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: query
rules:
  - apiGroups: ["custom.metrics.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ollie-hpa-controller-custom-metrics
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: query
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ollie-custom-metrics-server-resources
subjects:
  - kind: ServiceAccount
    name: horizontal-pod-autoscaler
    namespace: kube-system
---
# ollie-query reads the requestheader CA bundle the API server publishes
# in kube-system/extension-apiserver-authentication so it can pin the
# :6443 listener's ClientCAs to the front-proxy CA (mTLS from the
# aggregator). The built-in extension-apiserver-authentication-reader
# Role grants exactly `get` on that one ConfigMap — the standard grant
# aggregated API servers use.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ollie-query-auth-reader
  namespace: kube-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: query
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: ollie-query
    namespace: ollie-system
---
# Operator-editable metric-path -> PromQL template mapping
# (storage-and-query.md §7). ollie-query loads this file at startup;
# missing keys fall back to built-in defaults, empty values remove a
# default. Edit + `kubectl rollout restart deploy/ollie-query`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollie-custom-metrics
  namespace: ollie-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: query
data:
  config.yaml: |
    # metrics: map a metric name (the last URL segment the HPA
    # requests) to a PromQL text/template. {{.Selector}} expands to
    #   k8s_namespace_name="<ns>",<resource label>="<name>"
    # resources: map a resource plural to the series label that
    # identifies one object of that kind.
    #
    # Built-in defaults cover: qps, latency_p50, latency_p99,
    # bytes_in_per_sec, bytes_out_per_sec over pods, deployments,
    # statefulsets, daemonsets. `services` is deliberately not a
    # default (#193): OBI's service_name is OTel service attribution
    # (usually the owner workload name), NOT the K8s Service object
    # name. If your OBI service naming lines up, opt in here with
    #   resources: {services: service_name}
    # Example metric override:
    #
    # metrics:
    #   error_rate: 'sum(rate(http_server_request_duration_count{ {{.Selector}} ,http_response_status_code=~"5.."}[1m]))'
    metrics: {}
    resources: {}
