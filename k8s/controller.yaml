# v0.4 ollie-controller — 2-replica Deployment with Lease-based
# leader election, plus a headless-ish ClusterIP Service the agent
# DaemonSet dials for the gRPC AgentSession stream.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollie-controller
  namespace: ollie-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ollie
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollie
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: ollie-controller
      containers:
        - name: controller
          image: ollie-controller
          args:
            - --leader-elect=true
            - --leader-election-namespace=ollie-system
            - --metrics-addr=:9100
            - --probe-addr=:9101
            - --stream-addr=:9102
          ports:
            - name: metrics
              containerPort: 9100
            - name: healthz
              containerPort: 9101
            - name: stream
              containerPort: 9102
            # Validating admission webhook (ADR-0030), TLS from the
            # self-managed CA via the serving-cert mount below.
            - name: webhook
              containerPort: 9443
          livenessProbe:
            httpGet: { path: /healthz, port: healthz }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: healthz }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 500m
              memory: 300Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # CA-issued webhook serving cert (ADR-0030), created by the
            # leader's CA manager. optional:true so the controller
            # starts before its own leader has issued it — the webhook
            # serves a self-signed bootstrap cert (harmless while the
            # ValidatingWebhookConfiguration is still failurePolicy
            # Ignore with no caBundle) until kubelet mounts the real
            # one.
            - name: webhook-cert
              mountPath: /etc/ollie/tls
              readOnly: true
      volumes:
        - name: webhook-cert
          secret:
            secretName: ollie-webhook-serving
            optional: true
---
# ClusterIP Service for the gRPC stream. Agents resolve
# ollie-controller.ollie-system.svc.cluster.local:9102 to dial in.
# Service-level routing distributes new sessions across the two
# replicas; non-leader replicas reject AgentSession with
# FailedPrecondition, the agent reconnects, and the K8s endpoint
# rotation eventually lands it on the leader.
apiVersion: v1
kind: Service
metadata:
  name: ollie-controller
  namespace: ollie-system
  labels:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: controller
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ollie
    app.kubernetes.io/component: controller
  ports:
    - name: webhook
      port: 9443
      targetPort: webhook
    - name: stream
      port: 9102
      targetPort: stream
      protocol: TCP
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
